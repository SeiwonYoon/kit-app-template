<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBS API 테스터 — Kit 웹 브리지</title>
    <link rel="stylesheet" href="tbs_panel.css" />
    <link rel="stylesheet" href="api_tester.css" />
  </head>
  <body>
    <div class="page api-tester-page">
      <header class="api-tester-header">
        <h1>TBS Kit API 테스터</h1>
        <p class="api-tester-lead">
          <code>GET /api/registry</code> 카탈로그를 불러와 각 cmd·state를 브라우저에서 직접 호출·확인합니다.
          Kit(<code>morph.tbs_control_2</code>) 실행 후 이 페이지를 엽니다.
        </p>
        <div id="connBanner" class="banner warn">연결 확인 중…</div>
        <div class="row api-tester-toolbar">
          <label for="apiBase">API Base</label>
          <input class="w-path" type="text" id="apiBase" placeholder="비우면 같은 오리진 (예: http://127.0.0.1:8720)" />
          <button type="button" id="btnReloadRegistry">레지스트리 새로고침</button>
          <a class="api-tester-link" href="/">← 제어 패널</a>
        </div>
      </header>

      <nav class="api-tester-tabs" role="tablist">
        <button type="button" class="tab active" data-tab="commands">명령 (POST)</button>
        <button type="button" class="tab" data-tab="state">상태 (GET)</button>
        <button type="button" class="tab" data-tab="fields">fields 키</button>
        <button type="button" class="tab" data-tab="log">응답 로그</button>
      </nav>

      <section id="panelCommands" class="api-tester-panel">
        <div class="row">
          <label><input type="checkbox" id="chkExposedOnly" checked /> 노출된 cmd만 (exposed=true)</label>
        </div>
        <div id="commandsList" class="api-tester-cards"></div>
      </section>

      <section id="panelState" class="api-tester-panel hidden">
        <div class="row">
          <label><input type="checkbox" id="chkPollState" checked /> /api/state 폴링 (1초)</label>
          <button type="button" id="btnFetchState">지금 한 번 가져오기</button>
        </div>
        <div class="api-tester-split">
          <div>
            <h3>state 필드 (레지스트리)</h3>
            <ul id="stateFieldList" class="api-tester-field-list"></ul>
          </div>
          <div>
            <h3>현재 스냅샷 JSON</h3>
            <pre id="stateJson" class="api-tester-pre">(대기)</pre>
          </div>
        </div>
      </section>

      <section id="panelFields" class="api-tester-panel hidden">
        <p class="api-tester-hint">
          <code>apply_fields</code> / <code>sim_start</code> 의 <code>fields</code> 객체 키 목록입니다.
        </p>
        <table class="api-tester-table" id="fieldsTable">
          <thead>
            <tr>
              <th>키</th>
              <th>설명</th>
              <th>Kit 모델</th>
              <th>타입</th>
              <th>예시</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="panelLog" class="api-tester-panel hidden">
        <button type="button" id="btnClearLog">로그 지우기</button>
        <pre id="responseLog" class="api-tester-pre api-tester-log">(응답 없음)</pre>
      </section>
    </div>
    <script src="api_tester.js"></script>
  </body>
</html>
