[package]
title = "LAM Control 1"
version = "0.1.0"
description = "LAM 멀티 USD 독립 타임라인 재생 + LAM 시퀀스 편집기 (듀얼 화면·CSV 프리런 개발 브랜치). HTTP 원격 UI는 morph.lam_web_bridge."
category = "Example"
keywords = ["kit", "extension", "lam", "usd", "animation", "multi-usd"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"

# 본 확장은 morph.tbs_control_1 의 어떤 모듈도 import 하지 않는다.
# (USD_Timeline_Spec.md REQ-002 0줄 변경 원칙, §12 절대 보호 영역)

[core]
reloadable = true

[dependencies]
"omni.kit.uiapp" = {}
"omni.ui" = {}
"omni.usd" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.viewport.window" = {}
"omni.kit.window.filepicker" = {}
# 의도적으로 omni.timeline 은 의존성에서 빼둔다.
# LAM Runtime Evaluator (L5) 는 자체 update 루프로 attribute 를 reauthor 하므로
# omni.timeline.set_current_time() 을 호출하지 않는다(USD_Timeline_Spec.md §3.1, REQ-004).

[settings]

[[python.module]]
name = "morph.lam_control_1"

# 저장 시 자동 리로드 — morph/*.py · config/*.toml 감시
[fswatcher]
patterns.include = ["*.py", "*.toml"]
patterns.exclude = ["*.pyc"]
paths.include = ["*/morph/*", "*/config/*"]
paths.exclude = ["*/__pycache__/*", "*/.git/*", "*/data/*", "*/docs/*"]

[documentation]
pages = ["docs/LAM_Spec.md", "docs/LAM_Web_UI.md", "docs/CHANGELOG.md"]
