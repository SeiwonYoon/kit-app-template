[package]
title = "Base Area Chart"
version = "0.1.0"  # Semantic Versioning is used: https://semver.org/
description = "Area Chart extension for morph base UI. Use it as a starting point for chart extensions."
category = "Example"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "example", "extension", "python", "ui", "area", "chart"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"  # URL of the extension source repository


[dependencies]
"omni.kit.uiapp" = {}


[settings]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import morph.base_area_chart"
name = "morph.base_area_chart"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
    "omni.kit.test",
    "omni.kit.ui_test"  # UI testing extension
]

args = [
]
